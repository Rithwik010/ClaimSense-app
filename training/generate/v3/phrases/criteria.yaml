        A: ["The patient has long-standing stable irritable bowel syndrome with unchanged symptoms and asks for a colonoscopy."]
      negated:
        A: ["The symptoms are new and not explained by a known stable condition."]
        B: ["Sx new, not attributable to known stable condition."]
    c7:
      placement: {section: results, report: imaging_report}
      met:
        A: ["CT colonography showed a {size} mm polyp, and snare removal is planned."]
        B: ["CTC: {size} mm polyp; plan snare polypectomy."]
      not_met:
        A: ["No polyp, bleeding lesion or other lesion needing treatment has been found."]
      uncertain:
        A: ["A polyp may have been seen on earlier imaging; the report is not available."]

  POL-SURG-003:
    c1:
      placement: {section: results, report: imaging_report}
      met:
        A: ["Varicose veins of the {side} great saphenous vein cause aching, swelling and heaviness, and duplex ultrasound shows reflux."]
      not_met:
        A: ["The veins are only small branches, and duplex ultrasound shows no great or small saphenous reflux."]
      uncertain:
        A: ["Venous reflux is possible; no duplex ultrasound has been done."]
    c2:
      placement: {section: hpi}
      not_met:
        A: ["Compression stockings have never been tried, and the patient wants the procedure now."]
      negated:
        A: ["The veins are symptomatic and conservative measures have been tried."]
    c3:
      placement: {section: exam}
      not_met:
        A: ["There are small red and blue spider veins on both thighs, and the concern is cosmetic."]
      negated:
        A: ["These are not spider veins alone."]
    c4:
      placement: {section: hpi, report: therapy_summary}
      met:
        A: ["Symptoms continue after 3 months of compression, leg elevation and exercise, and the aching limits walking."]
      not_met:
        A: ["The concern is mild and cosmetic only, with no pain, swelling, ulcer or bleeding."]
      uncertain:
        A: ["The patient may have worn compression stockings for a while; the dates are unclear."]

  POL-SURG-004:
    c5:
      placement: {section: exam}
      met:
        A: ["Extra upper eyelid skin hangs onto the lashes of both eyes."]
        A2: ["The {side} upper lid droops down over the pupil."]
      not_met:
        A: ["The eyelids are in a normal position on exam."]
      uncertain:
        A: ["The lids may be a little heavy; the position was not measured."]
    c6:
      placement: {section: hpi}
      replace: [not_met]
      met:
        A: ["The patient says the lids block the upper part of vision, so reading and driving are hard."]
        B: ["Pt reports lids obstruct superior vision; difficulty reading, driving."]
      not_met:
        A: ["The patient reports that the eyelids cause no trouble with seeing.", "The eyelids do not get in the way of the patient's vision, by the patient's report."]
        B: ["Pt reports no visual obstruction from lids.", "Lids not affecting vision per pt."]
      uncertain:
        A: ["The patient is not sure whether the lids affect vision."]
    c7:
      placement: {section: results}
      met:
        A: ["With the lids taped up, the upper visual field improves by {deg} degrees on testing."]
        B: ["VF taped vs untaped: {deg} deg superior gain."]
      not_met:
        A: ["The visual fields are full, with only {small} degrees of upper loss."]
      uncertain:
        A: ["Visual field testing is to be scheduled."]
    c8:
      placement: {section: hpi}
      not_met:
        A: ["The patient wants the surgery to look less tired."]
      negated:
        A: ["The request is not for appearance."]
        B: ["Not cosmetic."]

  POL-WOUND-001:
    c1:
      placement: {section: plan}
      met:
        A: ["Dead tissue was removed from the {size} cm ulcer on the {site} down to the fat layer, with the patient seen one on one."]
        B: ["Sharp debridement of {size} cm {site} ulcer to subcut tissue, 1:1."]
      not_met:
        A: ["Only the dressing was changed; no dead tissue was removed."]
      uncertain:
        A: ["The wound was looked at; what was done is not described."]
    c2:
      placement: {section: plan}
      met:
        A: ["The care plan addresses off-loading, infection control and blood-sugar control so that the wound can close."]
        B: ["Plan: offloading, infection control, glycemic control; goal closure."]
      not_met:
        A: ["No plan addresses off-loading, infection or blood-sugar control."]
      uncertain:
        A: ["A care plan will be discussed at the next visit."]
    c4:
      placement: {section: results, report: prior_procedure}
      situation:
        A: ["Wound care has gone on for {many} weeks."]
      met:
        A: ["This is the {nth} debridement; the ulcer has gotten smaller each week, and the treatment plan was reviewed and changed last week."]
      not_met:
        A: ["Weekly debridement has continued for {many} weeks with no improvement and no review of the treatment plan."]
      uncertain:
        A: ["The wound may be a bit smaller; it was not measured."]

# --- Borderline cases --------------------------------------------------------------------------------
# For each case: the sentence (by wording) and the slot values. `checks`: slot, comparator, threshold
# (with `unit` days for dates written as "{slot}" rendered from the visit date, see SPEC.md). The status
# is MET when the rule holds, otherwise NOT_MET; above = MET, below = NOT_MET.
borderline:
  POL-PAIN-001.c10:
    source: "LCD L33906 v75 cov-014: pain duration of at least four (4) weeks"
    rule: all
    checks: [{slot: duration_days, op: ">=", value: 28}]
    with_not_met: []
    forms:
      - A: "The pain has lasted {weeks} weeks, with no relief from {therapy} and anti-inflammatory medicine."
        B: "Pain x{weeks} wks, failed {therapy} + NSAIDs."
        derive: {duration_days: "weeks*7"}
        above: [{weeks: 4}, {weeks: 5}]
        below: [{weeks: 3}]
      - A: "The pain began on {onset_date} and has not improved with {therapy} and anti-inflammatory medicine."
        B: "Onset {onset_date}; no improvement w/ {therapy} + NSAIDs."
        date_slot: onset_date
        derive: {duration_days: "onset_date_days"}
        above: [{onset_date_days: 28}, {onset_date_days: 31}]
        below: [{onset_date_days: 24}, {onset_date_days: 26}]
  POL-PAIN-002.c6:
    source: "LCD L33930 (policy text POL-PAIN-002.c6): pain lasting at least 3 months"
    rule: all
    checks: [{slot: duration_months, op: ">=", value: 3}]
    with_not_met: []
    forms:
      - A: "The pain has gone on for {months} months despite physical therapy and medication."
        B: "Pain x{months} mo, failed PT and meds."
        derive: {duration_months: "months"}
        above: [{months: 3}]
        below: [{months: 2}]
  POL-PAIN-001.c8:
    source: "LCD L33906 v75 cov-019: at least 50% improvement in pain for at least three (3) months"
    rule: all
    checks: [{slot: pct, op: ">=", value: 50}, {slot: lasted, op: ">=", value: 3}]
    with_not_met: []
    forms:
      - A: "The previous injection {ago} months ago brought {pct}% pain relief lasting about {lasted} months, measured on the same scale as the baseline."
        B: "Prior ESI {ago} mo ago: {pct}% relief x~{lasted} mo, same scale as baseline."
        derive: {}
        above: [{ago: 4, pct: 50, lasted: 3}, {ago: 5, pct: 55, lasted: 3}]
        below_suffix:
          A: " The same approach and level are planned again."
          B: " Same approach/level planned."
        below: [{ago: 4, pct: 45, lasted: 3}, {ago: 4, pct: 65, lasted: 2}]
  POL-FOOT-001.c1:
    source: "Policy text POL-FOOT-001.c1 (LCD and Benefit Policy Manual ch.15 §290): no feeling at 2 or more of 5 sites"
    rule: all
    checks: [{slot: sites, op: ">=", value: 2}]
    with_not_met: []
    forms:
      - A: "On monofilament testing the patient cannot feel {sites} of 5 sites on the {side} foot."
        B: "SWM: {sites}/5 sites insensate {side} foot."
        derive: {}
        above: [{sites: 2}]
        below: [{sites: 1}]
  POL-SURG-004.c7:
    source: "Policy text POL-SURG-004.c7: at least 12 degrees or 30 percent"
    rule: any
    checks: [{slot: deg, op: ">=", value: 12}, {slot: pct, op: ">=", value: 30}]
    with_not_met: []
    forms:
      - A: "With the lids taped up, the upper visual field improves by {deg} degrees ({pct} percent) on testing."
        B: "VF taped vs untaped: {deg} deg ({pct}%) superior gain."
        derive: {}
        above: [{deg: 12, pct: 24}, {deg: 10, pct: 30}]
        below: [{deg: 11, pct: 25}, {deg: 10, pct: 22}]
  POL-SURG-002.c3:
    source: "Policy text POL-SURG-002.c3: high risk, continued screening every 24 months"
    rule: all
    checks: [{slot: since_months, op: ">=", value: 24}]
    with_not_met: []
    forms:
      - A: "Both the patient's mother and brother had colon cancer, and the last colonoscopy was {since_months} months ago."
        B: "FHx CRC mother + brother; last colonoscopy {since_months} mo ago."
        derive: {}
        above: [{since_months: 24}, {since_months: 25}]
        below: [{since_months: 22}, {since_months: 23}]
  POL-IMG-001.c2:
    source: "Policy text POL-IMG-001.c2: a headache lasting more than two weeks that has not responded to treatment"
    rule: all
    checks: [{slot: days, op: ">", value: 14}]
    with_not_met: []
    forms:
      - A: "The headaches have continued for {days} days without relief from {medicine}, and the neurological exam is otherwise normal with no change in pattern."
        B: "HA x{days}d despite {medicine}; neuro exam nl, pattern unchanged."
        derive: {}
        above: [{days: 15}, {days: 16}]
        below: [{days: 13}, {days: 14}]
  POL-SURG-003.c4:
    source: "Policy text POL-SURG-003.c4: a failed 3-month trial of conservative therapy"
    rule: all
    checks: [{slot: trial_weeks, op: ">=", value: 13}]
    with_not_met: [POL-SURG-003.c2]  # under 3 months, the c2 exclusion's situation is present too
    forms:
      - A: "Aching that limits walking continues after {trial_weeks} weeks of compression stockings, leg elevation and exercise."
        B: "Aching limiting ambulation after {trial_weeks} wks compression/elevation/exercise."
        derive: {}
        above: [{trial_weeks: 13}, {trial_weeks: 14}]
        below: [{trial_weeks: 10}, {trial_weeks: 11}]
