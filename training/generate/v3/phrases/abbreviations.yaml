# Generator v3: common clinical shorthand (team-written list). The noise layer swaps a phrase for its
# short form at config.yaml noise.abbreviation_swap_rate, never inside a protected span (a fact
# phrase, a number, a date or a negation word). Longest phrases are tried first; matching is on whole
# words, case-insensitive, and the short form keeps the phrase's leading capital where it makes sense.
#
# Not used: "QD", "QOD", "U", "IU" alone and the other forms on The Joint Commission's "Do Not Use"
# list, so the notes never teach unsafe shorthand.

