# Synthetic clinical-note templates for generator v2 (training/generate/scenarios_v2.py), policy set v2.
#
# Written for ClaimSense (synthetic data only). The criteria come from data/curated/coverage_policies/v2;
# these sentences only describe a fictional patient so a criterion is met, not met, in its situation,
# or absent. Wording sets: A (plain sentences) and B (clinical shorthand); the note styles of
# scenarios_v2.py lay them out (A, B and C in training; D only in the test split). Leakage rule: no
# sentence may contain approve, deny, reject, pend or their forms, "not covered" or "medically
# necessary" (checked by checks.py).
#
# Slots as in clinical_notes.yaml. The shared sections (filler, plan line, office visit, distinct
# service, unrelated conditions) are read from clinical_notes.yaml.
#
# Criterion fields, read with the criterion's v2 type (requirement, exclusion, conditional; group):
#   met        sentences that show the criterion satisfied (never used for an exclusion);
#   not_met    sentences that show it not satisfied, or, for an exclusion, the excluded situation;
#   situation  conditionals: a sentence that shows the situation without what it needs (NOT_DOCUMENTED);
#   missing    the missing-information text when it is NOT_DOCUMENTED;
#   with_not_met, diagnoses_when_not_met: as in clinical_notes.yaml.
# Profile fields: indication (the group member that is the patient's indication), conditionals (the
# conditionals whose situation the profile is in), flag_conditionals (conditionals a rule flag puts in
# their situation), exclusions (those a deny_exclusion scenario may show), modifiers (on every line).

bypass_documentation:
  SEPARATE_EM:
    met:
      A: "Separately from the procedure, the visit addressed {problem}, with its own history, exam and treatment plan."
      B: "Separate E/M: {problem} addressed w/ own hx, exam, plan."
    missing: "Documentation of a significant, separately identifiable evaluation and management service on the procedure day"
  SURGERY_DECISION:
    met:
      A: "After the findings and options were reviewed at this visit, the patient and surgeon decided to go ahead with surgery."
      B: "Decision for surgery made at this visit after reviewing findings/options."
    missing: "Documentation that this visit led to the decision for surgery"
  SITES:
    met:
      A: "The second wound treated today is on the {site2}, a separate site from the first."
      B: "2nd wound tx'd today at {site2}, separate site."
    missing: "Documentation that the two services were at different anatomic sites"

problems: ["poorly controlled blood pressure", "a new cough with fever", "worsening knee pain", "a diabetes check with medication changes", "new dizzy spells"]

