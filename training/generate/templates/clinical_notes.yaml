    criteria:
      c1:
        kind: required
        met:
          A:
            - "The scan is ordered to evaluate {symptom}, and the provisional diagnosis on the order matches these symptoms."
            - "Symptoms written on the order ({symptom}) are the same ones described in today's exam."
          B:
            - "Indication: {symptom}; provisional dx matches order."
        not_met:
          A:
            - "The patient has no symptoms today; the scan is requested only for reassurance."
          B:
            - "Asymptomatic; imaging for reassurance only."
        missing: "Symptoms and provisional diagnosis that support the scan as ordered"
      c2:
        kind: required
        met:
          A:
            - "Headaches have continued for {weeks} weeks without relief from {medicine}, and exam shows {deficit}."
            - "The headache pattern changed sharply {days} days ago, and exam shows {deficit}."
          B:
            - "HA x{weeks}wk, refractory to {medicine}; exam: {deficit}."
        not_met:
          A:
            - "Headaches match the patient's usual migraines, respond to {medicine}, and the neurological exam is normal."
          B:
            - "Typical migraine pattern, responds to {medicine}; neuro exam nl."
        missing: "Findings that justify imaging for headache: focal neurological signs, a change in pattern, or headache lasting over two weeks despite treatment"
      c3:
        kind: required
        met:
          A:
            - "Contrast is ordered to characterize a {lesion} seen on the non-contrast study {days} days ago."
          B:
            - "Contrast to characterize {lesion} seen on prior non-contrast study."
        not_met:
          A:
            - "A contrast MRI of the brain was already done for this same illness {weeks} weeks ago, and nothing new has happened since."
          B:
            - "Contrast MRI brain already done this episode {weeks}wk ago; no interval change."
        missing: "The reason contrast is needed (for example a lesion to characterize, suspected stroke, tumor or infection)"
