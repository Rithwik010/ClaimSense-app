# Synthetic clinical-note templates for the scenario engine (training/generate/scenarios.py).
#
# Written for ClaimSense (synthetic data only). Criteria come from data/curated/coverage_policies;
# these sentences only describe a fictional patient so a criterion is met, not met, or missing.
# Template set A is used for train and validation; set B (different wording and style) only for
# the test split (INSTRUCTIONS.md §9.4). Leakage rule: no sentence may contain approve, deny,
# reject, pend or their forms, "not covered" or "medically necessary" (checked by checks.py).
#
# Slots: {name} is filled from the profile's `slots`; "a-b" means a random integer in [a, b]; a
# list picks one value; a list of mappings picks one mapping and merges its keys.
#
# Criterion fields: kind (required | exclusion), met / not_met (per template set), missing (text
# for SLMLine.missing_information), with_not_met (other criteria that fail together with this one
# when it is not met), diagnoses_when_not_met (replace the profile diagnoses in that state).

filler:
  A:
    - "Vital signs are stable."
    - "Allergies: none known."
    - "Current medications were reviewed and updated."
    - "The patient understands the plan and wants to go ahead."
    - "Past medical history was reviewed without changes."
  B:
    - "VS WNL."
    - "NKDA."
    - "Meds reconciled."
    - "Pt agrees w/ plan."
    - "PMH reviewed, no change."

plan_line:
  A: "Plan: {procedure}."
  B: "Plan -> {procedure}."

office_visit:
  A:
    - "Office visit to review the problem, examine the patient and agree on next steps."
    - "The visit included a history, a focused exam and a discussion of treatment options."
  B:
    - "OV: hx, focused exam, tx options discussed."
    - "Visit: eval + counseling done."

# NCCI bypass documentation (rules flag NCCI_BYPASS on the column-2 line with modifier XS).
distinct_service:
  wound:
    met:
      A: "A second, separate ulcer on the {site2} was also cleaned of dead tissue at this visit."
      B: "2nd separate wound ({site2}) debrided same visit."
    missing: "Documentation that the second debridement was on a separate wound or site"
  colon:
    met:
      A: "A {size} mm polyp in the {seg1} was removed with a snare, and a separate flat area in the {seg2} was sampled with forceps."
      B: "{size} mm {seg1} polyp -> snare; separate {seg2} flat lesion -> forceps bx."
    missing: "Documentation that the biopsy was taken from a lesion separate from the polyp removed with the snare"

# Clearly unrelated conditions for "diagnosis does not support the procedure" scenarios. Each code
# is used only for procedure codes whose billing-article groups do not contain it (checked).
unrelated_conditions:
  - code: J069
    A: "The patient has had a sore throat, runny nose and mild cough for four days."
    B: "URI sx x4d: sore throat, rhinorrhea, cough."
  - code: M1711
    A: "The patient has right knee pain and stiffness from arthritis, worse after walking."
    B: "R knee OA pain/stiffness, worse w/ ambulation."
  - code: H2513
    A: "Vision in both eyes has slowly clouded over the past year."
    B: "Gradual bilat visual clouding x1y."
  - code: F419
    A: "The patient reports worry, restlessness and poor sleep for several months."
    B: "Anxiety sx x months, poor sleep."
  - code: K5900
    A: "The patient reports hard stools and infrequent bowel movements."
    B: "Constipation, infrequent BMs."
  - code: J301
    A: "Sneezing and itchy eyes return every spring when trees are in bloom."
    B: "Seasonal sneezing/itchy eyes each spring."
  - code: N390
    A: "Burning with urination and urinary frequency began two days ago."
    B: "Dysuria + frequency x2d."
  - code: B351
    A: "Several toenails are thick, yellow and crumbly."
    B: "Thick yellow dystrophic toenails."
  - code: L237
    A: "An itchy rash appeared on the forearms after yard work."
    B: "Pruritic forearm rash after yard work."
  - code: I10
    A: "Blood pressure readings at home have been high."
    B: "Elevated home BP readings."
  - code: G4733
    A: "The patient's partner reports loud snoring and pauses in breathing at night."
    B: "Loud snoring + witnessed apneas per partner."
  - code: M79671
    A: "Right foot pain is worst with the first steps in the morning."
    B: "R foot pain, worst first steps AM."

policies:
