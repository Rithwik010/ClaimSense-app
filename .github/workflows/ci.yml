name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, import checks and tests
    runs-on: ubuntu-24.04  # pinned: GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19
    # No telemetry (D-PROC-4, D-PROC-5). CI runs no Qdrant server (the tests use Qdrant in memory);
    # the variable is set so any Qdrant started here would not report either.
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      QDRANT__TELEMETRY_DISABLED: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: claimsense
          POSTGRES_PASSWORD: claimsense
          POSTGRES_DB: claimsense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsense -d claimsense"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # P5.1 (D-OCR-1): the scanned-form OCR calls the Tesseract program through pytesseract.
      - name: Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      # D-RAG-2: the embedding model is cached, its SHA-256 checked, and the retrieval tests fail
      # instead of skipping when it is missing.
      - name: Cache the embedding model
        uses: actions/cache@v6.1.0
        with:
          path: data/generated/models/fastembed
          key: fastembed-bge-small-en-v1.5-onnx-q-52398278842e

      - name: Embedding model (fetch on a cache miss, check the SHA-256)
        run: uv run python -m scripts.verify.embedding_model fetch

      # D-DOC-3: the prompt token guard reads the base model's tokenizer from its local file only;
      # cached, fetched at the pinned commit on a cache miss, its SHA-256 checked.
      - name: Cache the prompt tokenizer
        uses: actions/cache@v6.1.0
        with:
          path: data/generated/models/gemma-4-E2B-it-d36bdd38
          key: gemma-4-E2B-it-tokenizer-d36bdd3855c8-cc8d3a0ce364

      - name: Prompt tokenizer (fetch on a cache miss, check the SHA-256)
        run: uv run python -m scripts.setup.fetch_tokenizer

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Import contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
        env:
          CLAIMSENSE_REQUIRE_DB: "1"
          CLAIMSENSE_REQUIRE_EMBEDDING: "1"
          HF_HUB_OFFLINE: "1"  # the tests download nothing; the model was fetched above

  web:
    name: Web app (lint, typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
