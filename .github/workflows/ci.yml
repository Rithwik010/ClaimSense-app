name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, import checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: claimsense
          POSTGRES_PASSWORD: claimsense
          POSTGRES_DB: claimsense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsense -d claimsense"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Import contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
        env:
          CLAIMSENSE_REQUIRE_DB: "1"
