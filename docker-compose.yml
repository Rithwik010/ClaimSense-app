# Local development services. Start: docker compose up -d   Stop: docker compose down
# Ports are bound to 127.0.0.1 only; the credentials are for local development.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: claimsense
      POSTGRES_PASSWORD: claimsense
      POSTGRES_DB: claimsense
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsense -d claimsense"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    environment:
      QDRANT__TELEMETRY_DISABLED: "true" # no usage reports to qdrant.io during a demo
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
