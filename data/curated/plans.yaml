# Fictional plans (synthesized; DECISIONS.md 2026-09-21). Money in integer cents; percentages in
# basis points (20% = 2000). Deductibles and out-of-pocket maximums reset every 1 January (D7).
# A plan with `out_of_network: null` does not cover out-of-network care (rule R08 denies it).

provider_types:
