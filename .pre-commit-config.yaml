# Runs on every `git commit`. Enable once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
